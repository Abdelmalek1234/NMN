<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NMN</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header {
            background-color: white;
            color: white;
            padding: 15px 20px;
            text-align: center;
        }

        nav {
            background-color: #333;
        }

        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
        }

        nav ul li a:hover {
            background-color: #B6B6B6;
            border-radius: 5px;
        }

        .section {
            padding: 20px;
            text-align: center;
        }

        .services {
            background-color: #f4f4f4;
        }

        .services h2, .contact h2 {
            color: #4CAF50;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
        header img {
            width: 250px;
            height: 150px;
        }
        form {
        display: flex;
        flex-direction: column;
        }

        form label {
        margin-bottom: 0.5em;
        }

        form input, form textarea {
        margin-bottom: 1em;
        padding: 0.5em;
        border: 1px solid #ccc;
        }

        form button {
        padding: 0.5em;
        background-color: #333;
        color: white;
        border: none;
        cursor: pointer;
        }

        section {
    padding: 2em;
}

#services {
    background-color: #f4f4f4;
}

.service {
    background-color: white;
    border: 1px solid #ddd;
    padding: 1em;
    margin: 1em 0;
}

#contact {
    background-color: #e2e2e2;
}
    </style>
</head>
<body>

<header>
    <IMG src="IMG/wd6D5I70Q6erZ2KaIp5lVw.webp" alt="NMN">
</header>

<nav>
    <ul>
        <li><a href="#services">الخدمات</a></li>
        <li><a href="#about">من نحن</a></li>
        <li><a href="#contact">اتصل بنا</a></li>
    </ul>
</nav>

<section id="services" class="section services">
    <h2>خدماتنا</h2>
    <p>نقدم مجموعة من الخدمات لتلبية احتياجاتك، بما في ذلك بيع الأجهزة الإلكترونية، مستلزمات المنزل، والمزيد...</p>
</section>

<section id="about" class="section about">
    <h2>من نحن</h2>
    <p>شركة صغيرة لبيع أغراض ومستلزمات الحياة.</p>
</section>

<section id="contact" class="section contact">
    <h2>اتصل بنا</h2>
</section>

<section id="contact">
    <form>
        <label for="name">الاسم:</label>
        <input type="text" id="name" name="name" required>
        <label for="email">البريد الإلكتروني:</label>
        <input type="email" id="email" name="email" required>
        <label for="message">الرسالة:</label>
        <textarea id="message" name="message" required></textarea>
        <button type="submit">إرسال</button>
    </form>
</section>

<section id="contact" class="section contact">
    <p>البريد الإلكتروني: NMN@gmail.com</p>
    <p>الهاتف: 50 85 01 61 05</p>
</section>

<footer>
    <p>جميع الحقوق محفوظة &copy; 2025</p>
</footer>
